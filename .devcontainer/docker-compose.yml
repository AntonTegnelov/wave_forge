name: wave_forge

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: wave-forge-dev:latest
    container_name: wave_forge
    hostname: wave-forge
    ports:
      # Host 2239 -> container sshd :22. Port allocation lives in
      # E:\Programmering\Code\DEVCONTAINER_TEMPLATE.md — claim there first.
      - "2239:22"
    # GPU access through Docker's standard GPU support (Docker Desktop on WSL2,
    # NVIDIA). Adds the WSL virtual GPU device /dev/dxg plus the CUDA/dxcore
    # user-space libraries. No privileged mode, no extra capabilities, no
    # Docker socket, no host drives: the container boundary is unchanged, the
    # only new ability is running work on the GPU. wgpu reaches the card via
    # Vulkan -> Mesa dozen -> D3D12 (built into the image; see Dockerfile).
    gpus: all
    volumes:
      # Repo root (includes any gitignored .env via the mount, never the image).
      - ..:/workspaces/wave_forge:cached
      # Host pubkeys installed by the entrypoint at startup — edit
      # %USERPROFILE%\.ssh\authorized_keys and restart, no rebuild needed.
      - ${USERPROFILE}/.ssh/authorized_keys:/tmp/host_authorized_keys:ro
      # Persist Claude Code OAuth credentials across rebuilds.
      - claude-config:/home/dev/.claude
      # Stable sshd host-key fingerprint across down/up cycles.
      - ssh-host-keys:/etc/ssh/keys
      # PAT credential store (and any other ~/.ssh state) survives recreates.
      - ssh-config:/home/dev/.ssh
      # CARGO_HOME (registry + git caches, cargo-installed binaries) survives
      # recreates (Zed's dev container flow recreates on first attach).
      - cargo-home:/home/dev/.cargo
      # Linux build output on a named volume: masks the (huge, Windows) target/
      # from the bind mount — wrong-platform artifacts and a slow bind mount —
      # and survives recreates.
      - target:/workspaces/wave_forge/target
      # Out-of-repo build caches (e.g. CARGO_TARGET_DIR for worktrees) survive
      # recreates instead of living on the writable layer.
      - cache:/home/dev/.cache
      # WSL's user-space GPU libraries, read-only, from the Docker Desktop VM
      # (not the Windows host): libd3d12.so / libd3d12core.so / libdxcore.so
      # in lib/, and the NVIDIA D3D12 user-mode driver (libnvwgf2umx.so) that
      # D3D12 loads from the driver store. `gpus: all` alone mounts only the
      # CUDA pieces, which is not enough for Vulkan-on-D3D12.
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    restart: unless-stopped
    init: true

volumes:
  claude-config:
  ssh-host-keys:
  ssh-config:
  cargo-home:
  target:
  cache:
