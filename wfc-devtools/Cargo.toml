[package]
name = "wfc-devtools"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Developer-only tools for testing and inspecting Wave Forge output. Never shipped as part of the library."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
wfc-core = { path = "../wfc-core" }
wfc-rules = { path = "../wfc-rules" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# Opt-in profiling of the stress runs; see docs/performance.md.
tracing = "0.1.44"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.23"
wfc-gpu = { path = "../wfc-gpu" }
