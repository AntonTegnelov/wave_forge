[package]
name = "wfc-devtools"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Developer-only tools for testing and inspecting Wave Forge output. Never shipped as part of the library."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
wfc-core = { path = "../wfc-core" }
wfc-rules = { path = "../wfc-rules" }
# The library the CLI and the end-to-end tests drive.
wave_forge = { path = ".." }

[dev-dependencies]
# The CPU reference solver is the ground truth for the tests here, never a fallback.
wfc-core = { path = "../wfc-core", features = ["reference"] }
