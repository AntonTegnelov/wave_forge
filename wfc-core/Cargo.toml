[package]
name = "wfc-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "The model Wave Forge generates from, and the seam a solver plugs into."

[dependencies]
wfc-rules = { path = "../wfc-rules" }
thiserror = "2.0.20"

[features]
default = []
# The CPU reference solver: ground truth for tests and the yardstick for benchmarks, never a
# fallback, so it is not compiled into a shipped build.
reference = []
