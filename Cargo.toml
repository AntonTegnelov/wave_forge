[package]
name = "wave_forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Rule-based world generation, in chunks, while a game runs."

[lib]
name = "wave_forge"
path = "src/lib.rs"

[dependencies]
wfc-core = { path = "wfc-core", features = ["serde"] }
wfc-rules = { path = "wfc-rules" }
wfc-gpu = { path = "wfc-gpu", default-features = false }
thiserror = "2.0.20"
# Packs are RON files read into serde types; the same versions wfc-rules reads rule files with.
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12.2"
# Products kept in a store: postcard is the compact binary serde format, so a product is kept
# exactly; flate2 compresses it, in pure Rust, and is already in the tree through the tools.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
flate2 = "1.1.10"
# The math functions stages decide by (a sine, an angle, a distance), computed the same on every
# platform, where the platform's C library would differ in the last bit; already in the tree
# through naga.
libm = "0.2.16"
# Only for the types `build_on` takes from an engine; the backend itself lives in wfc-gpu.
wgpu = { version = "30.0.1", optional = true }
# Reflection of the noise configuration, so a Bevy game edits it as it edits its own components;
# the Bevy plugin turns it on, at the Bevy version it tracks.
bevy_reflect = { version = "0.20.0", optional = true }

[dev-dependencies]
# The CPU reference solver: the facade's tests run without a GPU.
wfc-core = { path = "wfc-core", features = ["reference"] }
# Reads Godot's golden noise values (tests/fixtures/fastnoise), which Godot writes as JSON; the
# version wfc-rules already reads JSON with.
serde_json = "1.0.151"

[features]
default = ["wgpu"]
# The wgpu backend, and the two builders that take or make a wgpu device.
wgpu = ["dep:wgpu", "wfc-gpu/wgpu"]
# The CPU reference solver, for tests and benchmarks.
reference = ["wfc-core/reference"]
# `Reflect` on the noise configuration, for the Bevy plugin.
bevy_reflect = ["dep:bevy_reflect"]

[workspace]
members = [
    "wfc-core",
    "wfc-rules",
    "wfc-gpu",
    "wfc-devtools",
]
# The engine integrations are their own workspaces. An engine brings hundreds of crates with it, and
# nothing in the library depends on one, so `cargo test --workspace` stays about the library.
exclude = [
    "wave_forge_bevy",
    "wave_forge_godot",
]

[workspace.dependencies]
# Add common dependencies here if needed later

# Settings and the reasoning behind them are documented in docs/guides/performance.md, "Build
# profiles".
[profile.release]
lto = true
strip = true
codegen-units = 1

# Release with symbols, for profilers that map samples or instruction counts back to source.
# It inherits every optimisation setting so measurements describe what actually ships.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Every crate of this workspace takes these lints (`[lints] workspace = true`), and CI's clippy runs
# with `-D warnings`, so each is an error there. A lint allowed here contradicts a decision the
# project has taken, which its comment names.
[workspace.lints.rust]
# The one unsafe call, wgpu's pipeline cache, is allowed where it is made and says why it is sound.
unsafe_code = "warn"
missing_docs = "warn"
# Not used: it fires on every test, bench and binary target for each dependency of its crate that
# the target itself does not name.
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
nursery = "warn"
suspicious = "warn"

unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"
unimplemented = "warn"

# An impossible state fails loud with `expect` and the invariant it breaks
# (.claude/rules/fail-loud.md); `unwrap_used` still refuses one without a reason.
expect_used = { level = "allow", priority = 1 }
# Every platform has to get the same world: a fused multiply-add, or a library's rounding of
# `ln_1p`, `hypot` and the like, changes the last bit (clippy.toml's disallowed methods).
suboptimal_flops = { level = "allow", priority = 1 }
imprecise_flops = { level = "allow", priority = 1 }
manual_midpoint = { level = "allow", priority = 1 }
# Results are bit-exact by contract, and the tests compare them so.
float_cmp = { level = "allow", priority = 1 }
# Coordinates and counts are bounded long before a cast between widths could wrap
# (`stages::brushes::MAX_COORDINATE`), as for the truncation and sign casts below.
cast-possible-wrap = { level = "allow", priority = 1 }
module-name-repetitions = { level = "allow", priority = 1 }
cast-possible-truncation = { level = "allow", priority = 1 }
cast-precision-loss = { level = "allow", priority = 1 }
cast-sign-loss = { level = "allow", priority = 1 }
# A function is split when it takes on a second purpose, not at a line count
# (.claude/rules/separation-of-concerns.md).
too_many_lines = { level = "allow", priority = 1 }
# The documents' voice opens with a whole sentence of what an item is, however long.
too_long_first_doc_paragraph = { level = "allow", priority = 1 }
doc-markdown = { level = "allow", priority = 1 }
# Geometry and noise name their quantities as their formulas do: x, y, z, dx, dy.
many_single_char_names = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
# `const` is a promise in a public signature, made where a caller needs it, not wherever it compiles.
missing_const_for_fn = { level = "allow", priority = 1 }
# `pub(crate)` says an item is the crate's own wherever its module sits.
redundant_pub_crate = { level = "allow", priority = 1 }
# A walk along a curve steps a distance in cells, which is a float, by at least a minimum each time.
while_float = { level = "allow", priority = 1 }
# A `match` or `if let` reads as plainly as `map_or_else` with two closures.
option_if_let_else = { level = "allow", priority = 1 }
# What clippy flags is mostly an `expect` naming an invariant, a bug if it ever breaks; a panic a
# caller can cause, an argument out of range, gets its `# Panics` section by hand.
missing_panics_doc = { level = "allow", priority = 1 }
must-use-candidate = { level = "allow", priority = 1 }
missing-errors-doc = { level = "allow", priority = 1 }

[lints]
workspace = true
