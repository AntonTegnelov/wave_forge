# Stages decide by these values, and players on Windows, Linux and macOS have to get the same world
# (docs/architecture/engine-integration.md, "The same stages on every platform"). The platform's C
# library rounds these functions differently in the last bit, so the `libm` crate computes them.
# The engine workspaces, which only draw with them, have clippy.toml files of their own.
disallowed-methods = [
    { path = "f32::sin", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::cos", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::tan", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::asin", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::acos", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::atan", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::atan2", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::sin_cos", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::sinh", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::cosh", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::tanh", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::asinh", reason = "the platform's C library rounds it differently: use the libm crate" },
    { path = "f32::acosh", reason = "the platform's C library rounds it differently: use the libm crate" },
