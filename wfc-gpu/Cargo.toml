[package]
name = "wfc-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "The GPU solver for Wave Forge: one workgroup solves one region per dispatch."

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2.0.20"
wfc-core = { path = "../wfc-core" }
# wgpu's device and buffer requests are futures; this blocks on them without pulling in a runtime.
pollster = { version = "1.0.1", optional = true }
# The wgpu backend. A Godot extension builds without it and supplies its own ComputeBackend over
# the engine's RenderingDevice, so both are optional with the feature.
wgpu = { version = "30.0.1", features = [
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
], optional = true }

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
# The CPU reference solver is the ground truth the kernel's tests check against.
wfc-core = { path = "../wfc-core", features = ["reference"] }
# The city rule set the benchmarks measure, and the invariant checker.
wfc-devtools = { path = "../wfc-devtools" }
wfc-rules = { path = "../wfc-rules" }
