[package]
name = "wfc-gpu"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wfc-core = { path = "../wfc-core" }
wfc-rules = { path = "../wfc-rules" }

wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
lazy_static = { workspace = true }
once_cell = { workspace = true }
seahash = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
cfg-if = { workspace = true }
bitvec = { workspace = true }

# Futures / Async
futures = { workspace = true }
futures-channel = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }

# Specific versions for testing/profiling (potentially override workspace)
# wgpu-profiler = { workspace = true } 

# Add other dependencies needed by wfc-gpu
anyhow = { workspace = true } # For application-level error handling
regex = { workspace = true } # For parsing grid coordinates from error strings
image = { workspace = true } # Used in tests/examples
function_name = { workspace = true } # For error location information

[dev-dependencies]
tempfile = { workspace = true } # Used in tests

[build-dependencies]
serde = { workspace = true, features = ["derive"] } 
toml = { workspace = true }

# Add async-trait
async-trait = { workspace = true }
# Add tokio (time feature needed for sleep in tests)
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.140"
lazy_static = { workspace = true }

# Add other dependencies needed by wfc-gpu
anyhow = "1.0"
futures-channel = { workspace = true }
regex = "1.10.3"  # For parsing grid coordinates from error strings

[dev-dependencies]
env_logger = "0.11.3"
rand = "0.8.5"
test-strategy = "0.3.1"
proptest = "1.4.0"
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "gpu_benchmarks"
harness = false 

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "shader-optimizer"
path = "tools/shader_optimizer.rs"

[[bin]]
name = "shader-validator"
path = "tools/shader_validator.rs"
