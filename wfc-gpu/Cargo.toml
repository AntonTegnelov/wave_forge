[package]
name = "wfc-gpu"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wfc-core = { path = "../wfc-core" }
wfc-rules = { path = "../wfc-rules" }

wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
lazy_static = { workspace = true }
once_cell = { workspace = true }
seahash = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
cfg-if = { workspace = true }
bitvec = { workspace = true }

# Futures / Async
futures = { workspace = true }
futures-channel = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }

# Specific versions for testing/profiling (potentially override workspace)
# wgpu-profiler = { workspace = true }

# Add other dependencies needed by wfc-gpu
anyhow = { workspace = true } # For application-level error handling
regex = { workspace = true } # For parsing grid coordinates from error strings
image = { workspace = true } # Used in tests/examples
function_name = { workspace = true } # For error location information

[dev-dependencies]
tempfile = { workspace = true } # Used in tests

[build-dependencies]
toml = { workspace = true }
# Note: serde/serde_json might be needed here if build script uses them, but let's start clean.

